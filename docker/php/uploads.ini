; Upload limits aligned with nginx client_max_body_size (100m)
; and app validation: images.* max 8192 KB per file, up to 30 files.
upload_max_filesize = 16M
post_max_size = 100M
max_file_uploads = 40

; Batch photo processing (GD resize + thumbnail for up to 30 files) needs time
max_execution_time = 180
max_input_time = 180

; Headroom for GD decoding/resizing large photos (~48MB+ RAM per image)
memory_limit = 256M
